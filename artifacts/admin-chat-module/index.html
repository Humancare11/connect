<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Chat Module (standalone preview)</title>
<style>
/* ── Artifact-only chrome (not part of the original app) ───────────────────────────── */
html, body { margin: 0; background: #e8eaf0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
*, *::before, *::after { box-sizing: border-box; }
.art-bar { position: sticky; top: 0; z-index: 300; height: 40px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 0 16px; background: #fff; border-bottom: 1px solid #dce3ef; font-size: 12.5px; color: #5b6b8c; overflow: hidden; }
.art-bar b { color: #0f1b3d; }
.art-bar select, .art-bar button { font: inherit; padding: 3px 8px; border: 1px solid #dce3ef; border-radius: 6px; background: #fff; cursor: pointer; }
.art-bar .art-pill { background: #fff4e0; color: #8a5300; border: 1px solid #f1d5a1; border-radius: 999px; padding: 2px 10px; font-weight: 700; }

/* ── AdminDashboard.css: page shell, sidebar, topbar (subset used by the Live Chat pages) ── */
.ad-root{--art-h:40px;display:flex;min-height:calc(100vh - var(--art-h));width:100%;max-width:100vw;background:linear-gradient(145deg,#e8eaf0 0%,#eef0f5 50%,#e4e8ef 100%);background-attachment:fixed;color:#0b0443;position:relative;overflow-x:hidden}
.ad-root::before,.ad-root::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.ad-root::before{width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,.10) 0%,transparent 70%);top:-150px;left:-100px}
.ad-root::after{width:500px;height:500px;background:radial-gradient(circle,rgba(20,184,166,.08) 0%,transparent 70%);bottom:-100px;right:60px}
.ad-sidebar{position:fixed;top:calc(var(--art-h) + 16px);left:16px;bottom:16px;width:256px;z-index:200;background:#01164a;border:1px solid rgba(255,255,255,.85);border-radius:24px;box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 24px 48px rgba(99,102,241,.08),0 4px 16px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.ad-profile{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:12px 12px 4px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);border-radius:16px}
.ad-profile-avatar{width:42px;height:42px;background:#01164a;border:2px solid rgba(255,255,255,.3);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 4px 14px rgba(99,102,241,.4)}
.ad-profile-info{min-width:0}
.ad-profile-name{font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-profile-role{font-size:10.5px;color:rgba(165,180,252,.9);font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.6px}
.ad-nav{padding:14px 15px;flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.ad-nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:none;background:transparent;color:#c3c3c3;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background .18s,color .18s,transform .15s;text-align:left;width:100%;text-decoration:none;position:relative}
.ad-nav-item:hover{background:rgba(255,255,255,.5);color:#fff;transform:translateX(2px)}
.ad-nav-item.active{background:linear-gradient(90deg,rgba(99,102,241,.12) 0%,rgba(20,184,166,.08) 100%);color:#fff;font-weight:600;border:1px solid rgba(99,102,241,.2);transform:none}
.ad-nav-icon{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:.85}
.ad-nav-item.active .ad-nav-icon{opacity:1}
.ad-nav-badge{margin-left:auto;font-size:11px;font-weight:700;background:#dc2626;color:#fff;padding:1px 7px;border-radius:20px}
.ad-nav-group{display:flex;flex-direction:column;gap:2px}
.ad-nav-parent{font:inherit;font-size:13px;font-weight:500}
.ad-nav-arrow{margin-left:auto;font-size:17px;line-height:1;opacity:.7;transition:transform .18s ease,opacity .18s ease}
.ad-nav-parent:hover .ad-nav-arrow,.ad-nav-parent.open .ad-nav-arrow,.ad-nav-parent.active .ad-nav-arrow{opacity:1}
.ad-nav-parent:focus-visible,.ad-flyout .ad-nav-item:focus-visible{outline:2px solid #60a5fa;outline-offset:-2px}
.ad-new{margin-left:8px;font-size:10px;font-weight:800;letter-spacing:.06em;background:#22c55e;color:#062814;border-radius:6px;padding:2px 6px}
.ad-nav-parent .ad-nav-badge{margin-left:8px}
.ad-flyout{position:fixed;z-index:250;min-width:220px;padding:8px;display:flex;flex-direction:column;gap:2px;background:#01164a;border:1px solid rgba(255,255,255,.2);border-radius:16px;box-shadow:0 18px 44px rgba(1,22,74,.35),0 4px 14px rgba(0,0,0,.12);animation:ad-flyout-in .14s ease}
.ad-flyout .ad-nav-item{white-space:nowrap}
@keyframes ad-flyout-in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.ad-subnav{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px 14px;padding-left:8px;border-left:1px solid rgba(255,255,255,.15)}
.ad-sidebar-footer{padding:8px 15px 14px}
.ad-logout-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(239,68,68,.2);background:rgba(239,68,68,.05);color:#dc2626;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}
.ad-main{margin-left:calc(256px + 32px);flex:1;display:flex;flex-direction:column;min-height:calc(100vh - var(--art-h));position:relative;z-index:1;padding:16px 16px 16px 0;min-width:0}
.ad-topbar{position:sticky;top:calc(var(--art-h) + 16px);z-index:100;background:#01164a;border:1px solid rgba(255,255,255,.85);border-radius:20px;box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 12px 32px rgba(99,102,241,.07),0 2px 8px rgba(0,0,0,.06);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:20px}
.ad-topbar-title{font-size:17px;font-weight:600;color:#fff}
.ad-topbar-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.ad-topbar-user{font-size:13px;color:rgba(255,255,255,.85);font-weight:500;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:20px}
.ad-content{padding:4px 0 24px;flex:1;min-width:0}
.ad-burger{background:none;border:none;cursor:pointer;display:flex;color:#94a3b8;padding:4px}
.ad-scrim{display:none}
@media (max-width:768px){.ad-sidebar{transform:translateX(calc(-100% - 24px))}.side-open .ad-sidebar{transform:none}.side-open .ad-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199}.ad-main{margin-left:0;padding:16px}}

/* ── AdminLiveVisitors.css (copied) ─────────────────────────────────────────────────── */
.lcv{--lcv-surface:#fff;--lcv-surface-2:#f2f5fb;--lcv-line:#dce3ef;--lcv-ink:#0f1b3d;--lcv-muted:#5b6b8c;--lcv-accent:#1d4ed8;--lcv-accent-soft:#e3ebfd;--lcv-ai:#6d4ae0;--lcv-ai-soft:#eee9fd;--lcv-warn:#c2570c;--lcv-ok:#0e9f6e;--lcv-urgent:#d23b2a;color:var(--lcv-ink);font-size:14px;line-height:1.45;width:0;min-width:100%}
.lcv *,.lcv *::before,.lcv *::after{box-sizing:border-box}
.lcv-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lcv-title h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.lcv-eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--lcv-accent);text-transform:uppercase}
.lcv-title-side{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lcv-status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--lcv-muted)}
.lcv-status i{width:8px;height:8px;border-radius:50%;background:var(--lcv-muted)}
.lcv-status--live i{background:#22c55e}
.lcv-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.lcv-kpi{background:var(--lcv-surface);border-radius:16px;padding:16px 20px;border-top:3px solid var(--lcv-accent);box-shadow:0 6px 18px -12px rgba(11,31,92,.35)}
.lcv-n{font-size:34px;font-weight:800;line-height:1.1;color:var(--lcv-accent);font-variant-numeric:tabular-nums}
.lcv-l{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lcv-muted);margin-top:4px}
.lcv-kpi--g{border-color:var(--lcv-ok)}.lcv-kpi--g .lcv-n{color:var(--lcv-ok)}
.lcv-kpi--o{border-color:var(--lcv-warn)}.lcv-kpi--o .lcv-n{color:var(--lcv-warn)}
.lcv-kpi--p{border-color:var(--lcv-ai)}.lcv-kpi--p .lcv-n{color:var(--lcv-ai)}
.lcv-radar{display:flex;gap:14px;align-items:center;border:1px solid var(--lcv-line);background:var(--lcv-surface);border-radius:14px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap}
.lcv-ping{width:30px;height:30px;border-radius:50%;border:2px solid var(--lcv-accent);position:relative;flex:none}
.lcv-ping::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--lcv-accent);animation:lcv-pulse 1.6s infinite}
@keyframes lcv-pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.lcv-ping::after{animation:none}}
.lcv-radar-text{flex:1;min-width:220px;color:var(--lcv-muted);font-size:13.5px}
.lcv-radar-text b{color:var(--lcv-ink)}
.lcv-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.lcv-fbtn,.lcv-chip,.lcv-search{display:flex;align-items:center;gap:6px;border:1px solid var(--lcv-line);background:var(--lcv-surface);border-radius:10px;padding:7px 12px;font-size:13px}
.lcv-fbtn{font-weight:600}
.lcv-fbtn select{border:0;background:transparent;font:inherit;font-weight:600;color:inherit;outline:none}
.lcv-search{min-width:220px;color:var(--lcv-muted)}
.lcv-search input{border:0;background:transparent;font:inherit;color:var(--lcv-ink);outline:none;flex:1;min-width:0}
.lcv-count{font-size:17px;font-weight:800;margin:6px 0 10px}
.lcv-table-wrap{overflow-x:auto;border:1px solid var(--lcv-line);border-radius:14px;background:var(--lcv-surface)}
.lcv-table{border-collapse:collapse;width:100%;min-width:1080px}
.lcv-table th{font-size:12px;font-weight:700;color:var(--lcv-muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--lcv-line);white-space:nowrap}
.lcv-table td{padding:10px 14px;border-bottom:1px solid var(--lcv-line);white-space:nowrap;font-size:13.5px}
.lcv-table tr:last-child td{border-bottom:0}
.lcv-table tbody tr:hover{background:var(--lcv-surface-2)}
.lcv-who{display:flex;align-items:center;gap:10px}
.lcv-who small{display:block;color:var(--lcv-muted);font-size:11.5px}
.lcv-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;background:var(--lcv-surface-2);color:var(--lcv-ink)}
.lcv-av--anon{background:var(--lcv-ai-soft);color:var(--lcv-ai)}
.lcv-act{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.lcv-act i{width:8px;height:8px;border-radius:50%;background:var(--lcv-muted)}
.lcv-act--chatting i{background:#22c55e}.lcv-act--invited i{background:var(--lcv-ai)}.lcv-act--waiting i{background:var(--lcv-warn)}
.lcv-btn{border:1px solid var(--lcv-line);background:var(--lcv-surface);border-radius:9px;padding:7px 14px;font:inherit;font-weight:700;font-size:13px;min-width:110px;cursor:pointer;color:var(--lcv-ink)}
.lcv-btn--primary{background:var(--lcv-accent);border-color:var(--lcv-accent);color:#fff}
.lcv-btn:disabled{opacity:.5;cursor:not-allowed}
.lcv-mono{font-family:ui-monospace,"JetBrains Mono",Menlo,monospace;font-size:12px;font-variant-numeric:tabular-nums}
.lcv-muted{color:var(--lcv-muted)}
.lcv-empty{text-align:center;padding:30px 14px!important;color:var(--lcv-muted)}
@media (max-width:640px){.lcv-title h2{font-size:19px}.lcv-search{flex:1 1 100%}}
.lcv-btn--join{background:var(--lcv-warn);border-color:var(--lcv-warn);color:#fff}
.lcv-start-error{background:#fdeceb;color:var(--lcv-urgent);font-weight:600;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:8px}
.lcv-table td:nth-child(5){max-width:300px;overflow:hidden;text-overflow:ellipsis}
.lcv-actions{display:flex;gap:6px;align-items:center}
.lcv-btn--icon{min-width:0;padding:7px 9px}
.lcv-blocked{margin-top:14px;border:1px solid var(--lcv-line);border-radius:14px;background:var(--lcv-surface)}
.lcv-blocked-toggle{width:100%;text-align:left;border:0;background:transparent;font:inherit;font-weight:700;padding:12px 16px;cursor:pointer;color:var(--lcv-ink)}
.lcv-blocked-count{background:var(--lcv-surface-2);border-radius:6px;padding:1px 8px;font-size:12px;margin-left:6px}
.lcv-blocked-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.lcv-blocked-row{display:grid;grid-template-columns:150px 1fr auto auto;gap:12px;align-items:center;font-size:13px}
@media (max-width:640px){.lcv-blocked-row{grid-template-columns:1fr auto}}

/* ── LiveChatPages.css: Team, Reports, AI agent settings (copied) ───────────────────── */
.lcp{--lcp-surface:#fff;--lcp-surface-2:#f2f5fb;--lcp-line:#dce3ef;--lcp-grid:#e8edf5;--lcp-ink:#0f1b3d;--lcp-muted:#5b6b8c;--lcp-accent:#1d4ed8;--lcp-accent-soft:#e3ebfd;--lcp-ai:#6d4ae0;--lcp-agent:#0e9f6e;--lcp-warn:#c2570c;--lcp-urgent:#d23b2a;color:var(--lcp-ink);font-size:14px;line-height:1.45;width:0;min-width:100%}
.lcp *,.lcp *::before,.lcp *::after{box-sizing:border-box}
.lcp button,.lcp input,.lcp select,.lcp textarea{font:inherit;color:inherit}
.lcp :focus-visible{outline:2px solid var(--lcp-accent);outline-offset:2px}
.lcp-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lcp-title h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.lcp-eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--lcp-accent);text-transform:uppercase}
.lcp-muted{color:var(--lcp-muted)}
.lcp-mono{font-family:ui-monospace,"JetBrains Mono",Menlo,monospace;font-size:12.5px;font-variant-numeric:tabular-nums}
.lcp-note{color:var(--lcp-muted);font-size:12.5px;margin:10px 2px 0}
.lcp-error{background:#fdeceb;color:var(--lcp-urgent);font-weight:600;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:10px}
.lcp-btn{border:1px solid var(--lcp-line);background:var(--lcp-surface);border-radius:9px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}
.lcp-btn:hover:not(:disabled){border-color:var(--lcp-ink)}
.lcp-btn:disabled{opacity:.55;cursor:not-allowed}
.lcp-btn--primary{background:var(--lcp-accent);border-color:var(--lcp-accent);color:#fff}
.lcp-btn--danger{color:var(--lcp-urgent);border-color:#f0c4be}
.lcp-btn--small{padding:4px 10px;font-size:12px}
.lcp-table-wrap{overflow-x:auto;border:1px solid var(--lcp-line);border-radius:14px;background:var(--lcp-surface)}
.lcp-table{border-collapse:collapse;width:100%;min-width:860px}
.lcp-table th{font-size:12px;font-weight:700;color:var(--lcp-muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--lcp-line);white-space:nowrap}
.lcp-table td{padding:11px 14px;border-bottom:1px solid var(--lcp-line);font-size:13.5px;vertical-align:middle}
.lcp-table tr:last-child td{border-bottom:0}
.lcp-who{display:flex;align-items:center;gap:10px}
.lcp-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;background:var(--lcp-surface-2)}
.lcp-av--ai{background:#eee9fd;color:var(--lcp-ai)}
.lcp-name-edit{display:flex;gap:6px;align-items:center}
.lcp-name-edit input{border:1px solid var(--lcp-line);background:var(--lcp-surface-2);border-radius:8px;padding:5px 8px;width:150px}
.lcp-range{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lcp-range label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.lcp-range input[type="date"]{border:1px solid var(--lcp-line);background:var(--lcp-surface);border-radius:9px;padding:6px 8px}
.lcp-chips{display:flex;gap:6px;flex-wrap:wrap}
.lcp-chip{border:1px solid var(--lcp-line);background:var(--lcp-surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.lcp-chip[aria-pressed="true"]{background:var(--lcp-accent-soft);border-color:var(--lcp-accent);color:var(--lcp-accent)}
.lcp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.lcp-card{background:var(--lcp-surface);border-radius:16px;padding:16px 20px;border-top:3px solid var(--lcp-accent);box-shadow:0 6px 18px -12px rgba(11,31,92,.35)}
.lcp-card--ai{border-color:var(--lcp-ai)}.lcp-card--ok{border-color:var(--lcp-agent)}.lcp-card--warn{border-color:var(--lcp-warn)}
.lcp-n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.lcp-l{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lcp-muted);margin-top:4px}
.lcp-sub{font-size:12.5px;color:var(--lcp-muted);margin-top:6px}
.lcp-panel{background:var(--lcp-surface);border:1px solid var(--lcp-line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.lcp-panel h3{margin:0 0 4px;font-size:15px;font-weight:800}
.lcp-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.lcp-legend{display:flex;gap:16px;font-size:12.5px;font-weight:600;margin:4px 0 8px}
.lcp-legend span{display:inline-flex;align-items:center;gap:6px}
.lcp-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lcp-chart{position:relative}
.lcp-chart svg{width:100%;height:auto;display:block}
.lcp-chart text{fill:var(--lcp-muted);font-size:11px}
.lcp-tip{position:absolute;pointer-events:none;background:var(--lcp-ink);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}
.lcp-tip b{font-weight:700}
.lcp-bars{display:grid;gap:6px;margin-top:8px}
.lcp-bar-row{display:grid;grid-template-columns:38px 1fr 34px;gap:10px;align-items:center;font-size:12.5px}
.lcp-bar-track{height:10px;background:var(--lcp-surface-2);border-radius:4px;overflow:hidden}
.lcp-bar-fill{height:100%;background:#d4930a;border-radius:0 4px 4px 0}
.lcp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;align-items:start}
@media (max-width:520px){.lcp-grid{grid-template-columns:1fr}}
.lcp-field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.lcp-field>label{font-size:12.5px;font-weight:700}
.lcp-field input[type="text"],.lcp-field input[type="number"],.lcp-field select,.lcp-field textarea,.lcp-row input[type="text"],.lcp-row input[type="number"],.lcp-row select,.lcp-row textarea{border:1px solid var(--lcp-line);background:var(--lcp-surface-2);border-radius:8px;padding:7px 9px;width:100%}
.lcp textarea{min-height:84px;resize:vertical}
.lcp-help{font-size:12px;color:var(--lcp-muted)}
.lcp-radio,.lcp-check{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:13.5px}
.lcp-radio small{display:block;color:var(--lcp-muted);font-size:12px}
.lcp-radio input,.lcp-check input{margin-top:3px}
.lcp-row{display:grid;gap:8px;align-items:center;margin-top:8px}
.lcp-row--price{grid-template-columns:1fr 110px auto}

  if (r.mode === "archived") return `<span class="wk-tag wk-tag--done">${{ patient_left: "Left", blocked: "Blocked" }[r.closedReason] || "Resolved"}</span>`;

const tagFor = (c) => modeTag(c);
function transOf(c, m) {

  if (a === "r-table") { S.asTable = !S.asTable; $("rhour").innerHTML = hourChartHtml(S.report.perHour); return; }
  // Settings
  if (a === "s-addprice") { S.form.prices.push({ name: "", price: 0 }); S.message = ""; return renderSettings(); }
  if (a === "s-rmprice") { S.form.prices.splice(i, 1); S.message = ""; return renderSettings(); }
  if (a === "s-addopt") { const q = S.form.quickOptions; q.push({ key: slug("New option", q.map((o) => o.key)), label: "New option", icon: "dots", reply: "", link: "" }); S.message = ""; return renderSettings(); }
  if (a === "s-rmopt") { S.form.quickOptions.splice(i, 1); S.message = ""; return renderSettings(); }
  if (a === "s-up" || a === "s-down") { const q = S.form.quickOptions, j = i + (a === "s-up" ? -1 : 1); if (j < 0 || j >= q.length) return; [q[i], q[j]] = [q[j], q[i]]; S.message = ""; return renderSettings(); }
  if (a === "s-save") return saveSettings();
  if (a === "s-cadd") { S.cannedEditing = "new"; S.cannedDraft = { title: "", text: "", active: true }; S.cannedError = ""; return renderSettings(); }
  if (a === "s-cedit") { const r = S.canned.find((x) => x.id === id); S.cannedEditing = id; S.cannedDraft = { title: r.title, text: r.text, active: r.active }; S.cannedError = ""; return renderSettings(); }
  if (a === "s-ccancel") { S.cannedEditing = null; S.cannedError = ""; return renderSettings(); }
  if (a === "s-cdel") { const r = S.canned.find((x) => x.id === id); if (!window.confirm(`Delete the canned reply "${r.title}"?`)) return; S.canned = S.canned.filter((x) => x.id !== id); logCanned("cannedReply.deleted", r.title, ""); syncCanned(); S.cannedError = ""; return renderSettings(); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "vq") { S.vf.q = t.value; return updateVisitors(); }
  if (t.id === "vact") { S.vf.activity = t.value; return updateVisitors(); }
  if (t.id === "tn" && S.teamEdit) { S.teamEdit.value = t.value; return; }
  if (t.dataset.s && S.route === "settings") {
    const v = t.type === "checkbox" ? t.checked : t.type === "number" ? Number(t.value) : t.value;
    setP(S.form, t.dataset.s, v); S.message = ""; const m = $("savemsg"); if (m) m.textContent = "";
    delete S.errors[t.dataset.s]; document.querySelectorAll(`[data-err="${t.dataset.s}"]`).forEach((n) => n.remove());
    return;
  }
  if (t.dataset.cd) S.cannedDraft[t.dataset.cd] = t.type === "checkbox" ? t.checked : t.value;
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "rfrom" && t.value) { const to = S.range.to && t.value <= S.range.to ? S.range.to : t.value; S.range = { from: t.value, to }; renderReports(); }
  else if (t.id === "rto" && t.value) { S.range = { from: S.range.from || t.value, to: t.value }; renderReports(); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "tform") {
    e.preventDefault();
    const ed = S.teamEdit, v = ed.value.trim();
    if (!v) { ed.error = "Enter a name patients will see."; return renderTeam(); }
    S.team.find((x) => x.userId === ed.userId).displayName = v; S.teamEdit = null; renderTeam();
  } else if (e.target.id === "cform") {
    e.preventDefault();
    const d = S.cannedDraft;
    if (!d.title.trim() || !d.text.trim()) { S.cannedError = "Enter a title and the reply."; return renderSettings(); }
    if (S.cannedEditing === "new") { S.canned.push({ id: "c" + ++S.nextId, title: d.title.trim(), text: d.text.trim(), active: d.active }); logCanned("cannedReply.added", "", d.title.trim()); }
    else { const r = S.canned.find((x) => x.id === S.cannedEditing); Object.assign(r, { title: d.title.trim(), text: d.text.trim(), active: d.active }); logCanned(`cannedReply.${r.title}`, "edited", "saved"); }
    S.cannedEditing = null; S.cannedError = ""; syncCanned(); renderSettings();
  }
});
// Reports chart tooltip
document.addEventListener("mouseover", (e) => {
  const r = e.target.closest?.("rect[data-h]");
  if (r) showTip(r);
  else if (e.target.closest?.("#navparent, #flyout") && !phone()) { clearTimeout(closeT); if (!S.navOpen) { S.navOpen = true; renderNav(); } }
});
document.addEventListener("focusin", (e) => { const r = e.target.closest?.("rect[data-h]"); if (r) showTip(r); });
document.addEventListener("focusout", (e) => { if (e.target.closest?.("rect[data-h]")) $("rtip") && ($("rtip").style.display = "none"); });
function showTip(r) {
  const tip = $("rtip"); if (!tip) return; const h = Number(r.dataset.h), ai = Number(r.dataset.ai), ag = Number(r.dataset.ag);
  tip.style.display = "block"; tip.style.left = r.dataset.left + "%"; tip.style.top = `calc(${r.dataset.top}% - 6px)`;
  tip.innerHTML = `<b>${hourLabel(h)}–${hourLabel((h + 1) % 24)}</b><br>AI ${ai} · Agent ${ag} · Total ${ai + ag}`;
}
let closeT;
document.addEventListener("mouseout", (e) => {
  if (e.target.closest?.("#rchart") && !e.relatedTarget?.closest?.("#rchart")) $("rtip") && ($("rtip").style.display = "none");
  if (S.pinned || phone() || !S.navOpen) return;
  if (e.target.closest?.("#navparent, #flyout") && !e.relatedTarget?.closest?.("#navparent, #flyout")) { clearTimeout(closeT); closeT = setTimeout(() => { S.navOpen = false; renderNav(); }, 200); }
});
document.addEventListener("mousedown", (e) => { if (S.navOpen && !phone() && !e.target.closest("#navparent, #flyout")) { S.navOpen = false; S.pinned = false; renderNav(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.navOpen) { S.navOpen = false; S.pinned = false; renderNav(); $("navparent")?.focus(); } });
$("burger").addEventListener("click", () => $("adroot").classList.toggle("side-open"));
$("scrim").addEventListener("click", () => $("adroot").classList.remove("side-open"));
$("signout").addEventListener("click", () => window.alert("Mock: Sign Out is disabled in this standalone preview."));

// Artifact-only controls
$("art-role").addEventListener("change", (e) => { S.role = e.target.value; enter({ key: S.route, param: S.route === "ai" || S.route === "live" ? S.activeId : "" }); });
$("art-reset").addEventListener("click", () => { reset(); resetPages(); S.query = ""; S.draft = ""; enter({ key: S.route, param: "" }); });
// One timer ticks the chat panel's clocks, as in the original.
setInterval(() => { S.now = Date.now(); const c = active(); if ((S.route === "ai" || S.route === "live") && c && document.activeElement?.closest("#panel") == null) renderPanel(); }, 30000);

reset(); resetPages(); enter(parseHash());
</script>
</body>
</html>
