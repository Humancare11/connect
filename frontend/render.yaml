routes:
  - type: rewrite
    source: /*
    destination: /index.html

# Response headers Render applies to every static asset. These can't be set
# via a <meta> tag (frame-ancestors / X-Frame-Options in particular are
# HTTP-header-only per spec), unlike the CSP in index.html.
headers:
  - path: /*
    name: X-Frame-Options
    value: DENY
  - path: /*
    name: X-Content-Type-Options
    value: nosniff
  - path: /*
    name: Referrer-Policy
    value: strict-origin-when-cross-origin
  - path: /*
    name: Permissions-Policy
    value: "camera=(self), microphone=(self), geolocation=()"