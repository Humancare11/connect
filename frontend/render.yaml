# Response headers Render applies to every static asset. These can't be set
# via a <meta> tag (frame-ancestors / X-Frame-Options in particular are
# HTTP-header-only per spec), unlike the CSP in index.html.
headers:
  - path: /*
    name: X-Frame-Options
    value: DENY
  - path: /*
    name: X-Content-Type-Options
    value: nosniff
  - path: /*
    name: Referrer-Policy
    value: strict-origin-when-cross-origin
  - path: /*
    name: Permissions-Policy
    value: "camera=(self), microphone=(self), geolocation=()"
  # Caching. Everything under /assets/ is content-hashed by Vite (a changed file gets a new name), so it
  # can be cached for a year. HTML pages, sitemap.xml and robots.txt must always revalidate; they carry
  # the links to the hashed files. (Pages get Render's default revalidating header: no long-cache rule
  # may ever match them, which scripts/check-seo.mjs enforces.)
  - path: /assets/*
    name: Cache-Control
    value: "public, max-age=31536000, immutable"
  - path: /sitemap.xml
    name: Cache-Control
    value: "public, max-age=0, must-revalidate"
  - path: /robots.txt
    name: Cache-Control
    value: "public, max-age=0, must-revalidate"
  - path: /404.html
    name: Cache-Control
    value: "public, max-age=0, must-revalidate"
  - path: /200.html
    name: Cache-Control
    value: "public, max-age=0, must-revalidate"
