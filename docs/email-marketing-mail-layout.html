<title>Marketing Mail Layout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: control bar on top, then a neutral mail-reader frame that renders the real email HTML in an iframe; notes underneath.
   Single light theme on purpose: it shows how an email looks in a light inbox. */
:root{
  --page:#eef1f7; --surface:#ffffff; --soft:#f6f8fc; --line:#e3e8f1;
  --ink:#16213e; --muted:#66718a; --faint:#98a2b6;
  --blue:#2563eb; --blue-soft:#e6eefe; --green:#0f8a5f; --green-soft:#e3f5ec; --red:#c2352b; --red-soft:#fbe5e3;
  --navy:#1a1c5c;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--page)}
body{color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp>span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tabs{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--blue);box-shadow:0 1px 3px rgba(22,33,62,.12)}
.tabs button.on.bad{color:var(--red)}.tabs button.on.good{color:var(--green)}
.reader{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.mhead .av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.mhead b{display:block;font-size:17px}
.mhead small{color:var(--muted);font-size:12.5px}
.tag{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.tag.bad{background:var(--red-soft);color:var(--red)}.tag.good{background:var(--green-soft);color:var(--green)}
.stage{background:var(--soft);padding:16px;display:flex;justify-content:center}
.frame{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:max-width .2s}
.frame.mobile{max-width:390px}
.frame iframe{display:block;width:100%;height:720px;border:0;background:#fff}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.note b{display:block;margin-bottom:4px}
.note p{margin:0;color:var(--muted);font-size:13px}
.note .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:12px;margin-right:6px}
@media (max-width:760px){.notes{grid-template-columns:1fr}.frame iframe{height:640px}}
</style>

<div class="wrap">
  <div><h1>Marketing mail layout</h1><p class="sub">How a received campaign mail looks now, and after the fix. Sample content, real signature.</p></div>

  <div class="bar">
    <div class="grp"><span>Mail type</span><div class="tabs" id="tMode"><button data-v="text" class="on">Write text</button><button data-v="html">HTML design</button></div></div>
    <div class="grp"><span>Version</span><div class="tabs" id="tVer"><button data-v="before" class="bad">Now</button><button data-v="after" class="on good">After fix</button></div></div>
    <div class="grp"><span>Screen</span><div class="tabs" id="tDev"><button data-v="desktop" class="on">Desktop</button><button data-v="mobile">Mobile</button></div></div>
  </div>

    <div class="stage"><div class="frame" id="frame"><iframe id="mail" title="Email preview" sandbox=""></iframe></div></div>

</div>

  html:{

    after:[["Design stays as you made it","The pasted HTML design is not changed."],["Signature lines up with the design","It sits in a centered 600px column, aligned with the left edge of the design."],["Address stays plain text","Footer wording and the unsubscribe link stay the same."]]

function render(){
  document.getElementById("mail").srcdoc=build();
  document.getElementById("frame").className="frame"+(S.dev==="mobile"?" mobile":"");
  document.getElementById("subj").textContent=S.mode==="text"?"Hello Satish, quick question":"Hello Satish, see a doctor online wherever you are";
  const tag=document.getElementById("vtag");tag.textContent=S.ver==="before"?"Now":"After fix";tag.className="tag "+(S.ver==="before"?"bad":"good");
  document.getElementById("notes").innerHTML=NOTES[S.mode][S.ver].map((n,i)=>`<div class="note"><b><span class="n">${i+1}</span>${n[0]}</b><p>${n[1]}</p></div>`).join("");
}
function tabs(id,key){
  document.querySelectorAll(`#${id} button`).forEach(b=>b.addEventListener("click",()=>{
    S[key]=b.dataset.v;
    document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle("on",x===b));
    render();
  }));
}
tabs("tMode","mode");tabs("tVer","ver");tabs("tDev","dev");
render();
</script>
