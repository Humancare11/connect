<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Chat Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-pane support console (chat list | conversation + composer | visitor panel), dark like the reference screenshot. */
:root{
  --bg:#141416; --surface:#18181b; --surface-2:#232327; --surface-3:#2c2c31; --line:#2b2b30; --line-2:#37373d;
  --ink:#f3f3f5; --muted:#9b9ba4; --faint:#6e6e77;
  --accent:#3b82f6; --accent-soft:#16294d; --bubble:#1a2f5c; --bubble-ink:#eaf0ff;
  --ai:#a78bfa; --ai-soft:#2a2150; --warn:#f5a524; --warn-soft:#3a2b10; --ok:#22c55e; --urgent:#ef4444;
  --f-ui:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
 --av-a:#b8890b; --av-a-ink:#1b1303; --av-anon:#6b3d7d; --av-anon-ink:#f1dff7; --av-me:#7e9a2f; --av-me-ink:#12190a;
  --warn-line:#5a4416; --ai-line:#3d3270; --accent-ink:#7fb0ff; --accent-hover:#2f74ee; --lang-bg:#2f2a14; --lang-ink:#e8c766;
  --err-bg:#3a1715; --danger-ink:#ff8d82; --ai-ink:#ece6ff; --note-ink:#f6dca4; --box-note-bg:#1d1810; --box-line:#3a3a41; --chip-line:#4a4a52;
  --warn-btn-ink:#241a05; --danger-line:#5c2723; --sc-bg:#7cb7f5; --sc-ink:#0b1a2e; --sc-hover:#93c4f8; --sc-bg2:#4592f0; --pop-bg:#1e1e22; --shadow-c:rgba(0,0,0,.28); --shadow-c2:rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#eef0f5; --surface-3:#e3e6ee; --line:#e1e4ec; --line-2:#cfd4e0;
  --ink:#14161c; --muted:#5d6475; --faint:#8a90a0;
  --accent:#2563eb; --accent-soft:#e1ebff; --bubble:#dbe7ff; --bubble-ink:#10264f;
  --ai:#6d4ae0; --ai-soft:#eee9fd; --warn:#b45309; --warn-soft:#fdf0dc; --ok:#15a34a; --urgent:#dc2626;
  --av-a:#f3d27a; --av-a-ink:#4a3400; --av-anon:#e6d3f0; --av-anon-ink:#4b2760; --av-me:#cfe3a0; --av-me-ink:#2f4410;
  --warn-line:#efd29a; --ai-line:#cdbff5; --accent-ink:#1d4ed8; --accent-hover:#1d4fd1; --lang-bg:#fbf0cc; --lang-ink:#8a5f00;
  --err-bg:#fdeceb; --danger-ink:#b42318; --ai-ink:#3d2a8f; --note-ink:#6b4300; --box-note-bg:#fff8ea; --box-line:#cfd4e0; --chip-line:#b7bdcc;
  --warn-btn-ink:#ffffff; --danger-line:#f0c4be; --sc-bg:#2563eb; --sc-ink:#ffffff; --sc-hover:#1d4fd1; --sc-bg2:#1d4fd1; --pop-bg:#ffffff; --shadow-c:rgba(20,30,60,.08); --shadow-c2:rgba(20,30,60,.16);
  color-scheme:light;
}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);}
*,*::before,*::after{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}

/* Artifact-only controls */
.art-page{padding:10px 16px 14px}
.art-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted)}
.art-bar b{color:var(--ink);font-weight:600}
.art-bar select,.art-bar button{padding:4px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:12px}
.art-theme{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-weight:600}
.art-pill{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);border-radius:999px;padding:2px 10px;font-weight:600}

/* Shell */
.wk-wrap-page{width:100%}
.wk-inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;height:calc(100vh - 78px);min-height:600px;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
.wk-inbox.no-panel{grid-template-columns:300px minmax(0,1fr)}
.wk-inbox.no-panel .wk-profile{display:none}
.wk-mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.wk-small{font-size:11.5px}.wk-muted{color:var(--muted)}
.wk-row{display:flex;justify-content:space-between;gap:6px;align-items:center}.wk-wrap{flex-wrap:wrap}
.wk-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none;background:var(--av-a);color:var(--av-a-ink);position:relative}
.wk-av--anon{background:var(--av-anon);color:var(--av-anon-ink)}
.wk-av--lg{width:40px;height:40px}
.wk-av.sm{width:26px;height:26px;font-size:10.5px}
.wk-av.me{background:var(--av-me);color:var(--av-me-ink)}
.wk-av.ai{background:var(--ai-soft);color:var(--ai);border:1px solid var(--ai-line)}
.wk-av i{position:absolute;right:-2px;top:-2px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.wk-av i.is-gone{background:#6e6e77}

/* List */
.wk-list{border-right:1px solid var(--line);overflow-y:auto;min-height:0;background:var(--bg)}
.lhead{display:flex;align-items:center;height:56px;padding:0 16px;font-weight:600;font-size:15px;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.lhead small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.wk-search{padding:8px 12px 2px;position:relative}
.wk-search .ic{position:absolute;left:23px;top:17px;color:var(--faint)}
.wk-search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px 6px 34px;font-size:13px;outline:none}
.wk-search input:focus{border-color:var(--accent)}
.lh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px}
.lh button{border:0;background:transparent;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:4px;padding:2px 0}
.lh .lh-s{font-weight:600;color:var(--ink)}
.lh .lh-s:hover,.lh .lh-t:hover{color:var(--accent)}
.wk-conv{display:flex;gap:11px;padding:10px 12px;margin:2px 6px;border:0;border-radius:10px;width:calc(100% - 12px);text-align:left;background:transparent}
.wk-conv:hover{background:var(--surface)}
.wk-conv.is-active{background:var(--surface-3)}
.wk-conv.is-closed{opacity:.6}
.wk-conv-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wk-conv-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-prev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.wk-prev .ic{color:var(--muted)}
.wk-prev--typing{color:var(--accent);font-style:italic}
.wk-tags-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:3px}
.wk-badge{background:var(--urgent);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;margin-left:auto}
.wk-tag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.wk-tag--ai{background:var(--ai-soft);color:var(--ai)}
.wk-tag--human{background:var(--accent-soft);color:var(--accent-ink)}
.wk-tag--wait{background:var(--warn-soft);color:var(--warn)}
.wk-tag--done{background:var(--surface-3);color:var(--muted)}
.wk-tag--lang{background:var(--lang-bg);color:var(--lang-ink)}
.wk-rating{color:#e8b100;letter-spacing:1px;font-size:12px;white-space:nowrap}
.wk-empty{margin:auto;color:var(--muted);text-align:center;font-size:13px;max-width:32ch;padding:24px}
.wk-list .wk-empty{max-width:none}

/* Conversation */
.wk-chat{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg);position:relative}
.wk-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:0 18px;min-height:56px;border-bottom:1px solid var(--line)}
.wk-head-t{display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.wk-head-t strong{font-size:15.5px;font-weight:600}
.wk-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:relative}
.wk-btn{border:1px solid var(--line-2);background:transparent;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:600}
.wk-btn:hover:not(:disabled){background:var(--surface-2)}
.wk-btn:disabled{opacity:.5;cursor:not-allowed}
.wk-btn--go{background:var(--accent);border-color:var(--accent);color:#fff}
.wk-btn--go:hover:not(:disabled){background:var(--accent-hover)}
.wk-btn--ai{color:var(--ai);border-color:var(--ai-line)}
.hic{width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;border-radius:9px;color:var(--ink)}
.hic:hover{background:var(--surface-2)}
.hic[aria-pressed="true"]{background:var(--surface-3)}
.wk-error,.wk-info{font-size:12.5px;font-weight:600;padding:8px 18px;border-bottom:1px solid var(--line)}
.wk-error{background:var(--err-bg);color:var(--danger-ink)}
.wk-info{background:var(--accent-soft);color:var(--accent-ink)}
.wk-viewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.wk-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.wk-seg button{border:0;background:transparent;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.wk-seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.wk-body{flex:1;overflow-y:auto;padding:8px 24px 10px;display:flex;flex-direction:column;gap:2px;min-height:0}
.divider{display:flex;align-items:center;gap:14px;margin:0 auto 4px;width:100%;max-width:820px;color:var(--ink);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.divider span{background:var(--surface-2);padding:3px 12px;border-radius:8px}
.mrow{display:flex;gap:8px;align-items:flex-start;width:100%;max-width:820px;margin:0 auto}
.mrow.is-first{margin-top:7px}
.mrow.right{justify-content:flex-end}
.mcol{display:flex;flex-direction:column;gap:1px;min-width:0;max-width:78%}
.mrow.right .mcol{align-items:flex-end}
.mlabel{font-size:11px;font-weight:600;color:var(--muted);line-height:1.2}
.mg-sp{width:26px;flex:none}
.wk-msg{display:flex;align-items:flex-end;gap:12px;padding:5px 11px;border-radius:12px;font-size:13.5px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.wk-txt{min-width:0}
.wk-meta{display:block;flex:none;font-size:10.5px;margin:0;opacity:.65;text-align:right;white-space:nowrap;line-height:1.6}
.wk-left{background:var(--surface-2);border:1px solid var(--line-2);border-top-left-radius:4px}
.wk-right{background:var(--bubble);color:var(--bubble-ink);border-top-right-radius:4px}
.wk-right.wk-ai{background:var(--ai-soft);color:var(--ai-ink);border:1px solid var(--ai-line)}
.mrow:not(.is-first) .wk-msg{border-radius:12px}
.wk-note{width:100%;background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--note-ink);border-radius:10px;font-size:13px;white-space:pre-wrap}
.mrow.sysrow{justify-content:flex-end;padding-right:34px;margin-top:5px}
.wk-sys{font-size:11.5px;color:var(--muted);text-align:right}
.wk-typing{align-self:flex-start;width:100%;max-width:820px;margin:0 auto;font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}
.wk-dots{display:inline-flex;gap:3px}
.wk-dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:wk-b 1s infinite}
.wk-dots i:nth-child(2){animation-delay:.15s}.wk-dots i:nth-child(3){animation-delay:.3s}
@keyframes wk-b{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-3px);opacity:1}}
.wk-trans,.wk-source{display:block;margin-top:5px;font-size:11.5px;opacity:.85}
.wk-link{border:0;background:none;padding:0;color:var(--accent-ink);text-decoration:underline;cursor:pointer;overflow-wrap:anywhere}
.wk-file{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.wk-file-name{overflow-wrap:anywhere}.wk-file-name small{color:var(--muted)}

/* ── Composer (the "Enter message" bar) ───────────────────────── */
.cm{padding:2px 24px 10px}
.cm-inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.cm-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cm-chips::-webkit-scrollbar{display:none}
.cm-chip{flex:none;max-width:210px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:11px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s,border-color .12s}
.cm-chip:hover:not(:disabled){background:var(--surface-3);border-color:var(--chip-line)}
.cm-chip:disabled{opacity:.4;cursor:not-allowed}
.cm-box{position:relative;background:var(--surface);border:1px solid var(--box-line);border-radius:16px;padding:9px 14px 6px;transition:border-color .15s,box-shadow .15s,background .15s;box-shadow:0 8px 24px var(--shadow-c)}
.cm-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.2),0 8px 24px var(--shadow-c)}
.cm-box.is-note{background:var(--box-note-bg);border-color:var(--warn-line)}
.cm-box.is-note:focus-within{border-color:var(--warn);box-shadow:0 0 0 3px rgba(245,165,36,.18),0 8px 24px var(--shadow-c)}
.cm-src{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);padding:0 0 10px;margin-bottom:10px;border-bottom:1px dashed var(--line-2)}
.cm-text{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;font-size:14.5px;line-height:1.5;min-height:26px;max-height:150px;padding:0;overflow-y:auto}
.cm-text::placeholder{color:var(--faint)}
.cm-bar{display:flex;align-items:center;gap:2px;margin-top:4px}
.cm-mode{display:flex;align-items:center;gap:6px;border:0;background:transparent;font-weight:600;font-size:13.5px;padding:6px 8px;border-radius:9px}
.cm-mode:hover{background:var(--surface-2)}
.cm-sep{width:1px;height:20px;background:var(--line-2);margin:0 8px}
.cm-ic{height:30px;min-width:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;border-radius:9px;color:var(--muted);padding:0 7px}
.cm-ic:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.cm-ic:disabled{opacity:.35;cursor:not-allowed}
.cm-ic[aria-expanded="true"]{background:var(--surface-3);color:var(--ink)}
.cm-ic.is-ai{color:var(--ai)}
.cm-ic.spin .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cm-tr{font-size:12.5px;font-weight:600;color:var(--ink)}
.cm-hint{margin-left:auto;font-size:11.5px;color:var(--faint);padding-right:12px;white-space:nowrap}
.cm-send{border:0;border-radius:10px;padding:7px 16px;font-weight:600;font-size:13.5px;background:var(--surface-3);color:var(--faint);transition:background .12s,color .12s,transform .08s}
.cm-send:disabled{cursor:not-allowed}
.cm-send:not(:disabled){background:var(--accent);color:#fff}
.cm-send:not(:disabled):hover{background:var(--accent-hover)}
.cm-send:not(:disabled):active{transform:scale(.97)}
.cm-box.is-note .cm-send:not(:disabled){background:var(--warn);color:var(--warn-btn-ink)}
.pop{position:absolute;bottom:calc(100% + 8px);z-index:20;background:var(--pop-bg);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 16px 40px var(--shadow-c2);padding:6px}
.pop--mode{left:12px;width:200px}
.pop--canned{left:60px;width:min(380px,calc(100% - 72px));max-height:300px;overflow-y:auto}
.pop--lang{left:60px;width:220px}
.pop--emoji{left:130px;width:262px;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.pop-item{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-size:13px}
.pop-item:hover:not(:disabled){background:var(--surface-3)}
.pop-item:disabled{opacity:.4;cursor:not-allowed}
.pop-item b{font-weight:600}.pop-item span{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.pop-item.is-sel b::after{content:" ✓";color:var(--accent)}
.pop-em{border:0;background:transparent;border-radius:8px;height:34px;font-size:19px;line-height:1}
.pop-em:hover{background:var(--surface-3)}
.pop--more{right:0;left:auto;bottom:auto;top:calc(100% + 6px);width:190px}
.pop--more .pop-item.danger{color:var(--danger-ink)}

/* ── Visitor panel ─────────────────────────────────────────────── */
.wk-profile{border-left:1px solid var(--line);overflow-y:auto;min-height:0;background:var(--bg)}
.wk-phead{display:flex;gap:12px;align-items:center;padding:16px 18px 10px}
.wk-phead b{display:block;font-size:15px;font-weight:600}
.wk-phead small{color:var(--muted);font-size:12.5px}
.wk-facts{list-style:none;margin:0;padding:4px 18px 12px;display:flex;flex-direction:column;gap:11px;font-size:13px}
.wk-facts li{display:flex;gap:11px;align-items:center;min-width:0;overflow-wrap:anywhere}
.wk-facts li .ic{color:var(--muted)}
.wk-add{color:var(--muted)}
.wk-schips{display:flex;gap:7px;flex-wrap:wrap;padding:0 18px 16px;border-bottom:1px solid var(--line)}
.wk-schips span{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:500}
.wk-schips .is-first{background:var(--ai-soft);color:var(--ai)}
.wk-schips .is-ret{background:var(--accent-soft);color:var(--accent-ink)}
.wk-profile details{border-bottom:1px solid var(--line)}
.wk-profile summary{list-style:none;cursor:pointer;padding:15px 18px;font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk-profile summary::-webkit-details-marker{display:none}
.wk-profile summary>span{display:flex;align-items:center;gap:8px}
.wk-profile summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
.wk-profile details[open] summary::after{transform:rotate(45deg)}
.wk-profile summary small{font-weight:500;font-size:11.5px;background:var(--surface-3);padding:2px 9px;border-radius:7px;color:var(--ink)}
.wk-dbody,.wk-dbody-form{padding:0 18px 16px;font-size:12.5px;display:flex;flex-direction:column;gap:9px}
.wk-dbody-form{padding:0}
.wk-dbody input{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%;outline:none}
.wk-dbody input:focus{border-color:var(--accent)}
.wk-kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:12.5px;margin:0}
.wk-kv dt{color:var(--muted)}.wk-kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.wk-aisum{background:var(--ai-soft);border-radius:10px;padding:10px;font-size:12.5px;color:var(--ai-ink)}
.wk-tags{display:flex;gap:6px;flex-wrap:wrap}
.wk-ctag{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:3px 4px 3px 10px;font-size:12px;font-weight:600}
.wk-ctag button{border:0;background:transparent;color:inherit;font-size:14px;line-height:1;padding:0 4px}
.wk-pages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.wk-pages li{display:flex;justify-content:space-between;gap:8px}
.wk-tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line-2);display:flex;flex-direction:column;gap:11px}
.wk-tl li{position:relative;display:flex;flex-direction:column;min-width:0;font-size:12px}
.wk-tl li::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--line-2);border:2px solid var(--bg)}
.wk-tl li.is-cur::before{background:var(--ok)}
.wk-tl b{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-tl .wk-mono{color:var(--muted);font-size:11px}
.wk-note-line{color:var(--muted);font-size:12.5px}
.wk-field-error{color:var(--danger-ink);font-size:12px;font-weight:600}
.wk-saved{color:var(--ok);font-size:12px;font-weight:600}

.lcn-bar{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-bottom:8px}
.lcn-banner{flex:1;min-width:260px;background:var(--accent-soft);color:var(--accent-ink);display:flex;gap:12px;align-items:center;justify-content:center;padding:7px 16px;font-size:13px;font-weight:600;flex-wrap:wrap;border-radius:12px}
.lcn-banner button{border:1px solid var(--accent);background:transparent;color:var(--accent-ink);border-radius:8px;padding:3px 12px;font-weight:600}
.lcn-banner .lcn-x{border:0;margin-left:auto;padding:4px 8px}
.lcn-sound{border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:5px 12px;font-size:12px;font-weight:600}

@media (max-width:1280px){.wk-inbox{grid-template-columns:270px minmax(0,1fr) 300px}}
@media (max-width:1120px){.wk-inbox{grid-template-columns:260px minmax(0,1fr)}.wk-profile{display:none}.hic.pn{display:none}}
@media (max-width:760px){
  .wk-inbox{grid-template-columns:1fr;height:auto}
  .wk-list{max-height:240px;border-right:0;border-bottom:1px solid var(--line)}
  .wk-chat{height:78vh}
  .wk-profile{display:block;border-left:0;border-top:1px solid var(--line)}
  .wk-body{padding:14px 12px}.cm{padding:6px 12px 14px}.cm-hint{display:none}
  .pop--emoji{left:12px}.pop--canned{left:12px;width:calc(100% - 24px)}
  .mcol{max-width:86%}
}
@media (prefers-reduced-motion:reduce){.wk-dots i,.cm-ic.spin .ic{animation:none}.cm-send{transition:none}}

/* ── Real-time visitors, Team, Reports, AI agent settings ── */
/* ── AdminLiveVisitors.css (copied) ─────────────────────────────────────────────────── */
/* ── Real-time visitors (same layout as the reference app) ── */
.rt{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100vh - 160px);min-height:560px;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden;color:var(--ink);font-size:14px;line-height:1.45}
.rt *,.rt *::before,.rt *::after{box-sizing:border-box}
.rt button,.rt input{font:inherit;color:inherit}
.rt button{cursor:pointer}
.rt :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rt.no-panel{grid-template-columns:minmax(0,1fr)}
.rt.no-panel .rt-panel{display:none}
.rt-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.rt-head{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px;border-bottom:1px solid var(--line);flex:none}
.rt-head h2{margin:0;font-size:16px;font-weight:600}
.rt-body{flex:1;min-height:0;overflow-y:auto;padding:18px 18px 12px}
.rt-radar{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:14px;padding:18px 20px;font-size:13px;flex-wrap:wrap}
.rt-radar b{font-weight:600}
.rt-radar svg.i{color:var(--muted)}
.rt-sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.rt-radar .rt-rt{color:var(--ink);min-width:0;flex:1 1 280px}
.rt-filters{display:flex;gap:10px;margin:24px 0 22px;flex-wrap:wrap}
.rt-fwrap{position:relative}
.rt-fbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:transparent;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}
.rt-fbtn:hover{background:var(--surface-2)}
.rt-fcount{background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;min-width:17px;height:17px;display:inline-grid;place-items:center;padding:0 5px}
.rt-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:200px;background:var(--pop-bg);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 16px 40px var(--shadow-c2);padding:6px}
.rt-pop button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;font-size:13px}
.rt-pop button:hover{background:var(--surface-3)}
.rt-pop .is-on::after{content:" ✓";color:var(--accent-ink)}
.rt-count{font-size:15px;font-weight:700;margin:0 0 4px}
.rt-tablewrap{overflow-x:auto}
.rt-table{border-collapse:collapse;width:100%;min-width:1000px}
.rt-table th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:14px;white-space:nowrap;border-bottom:1px solid var(--line)}
.rt-table td{padding:0 14px;height:49px;font-size:13.5px;white-space:nowrap;border-bottom:1px solid var(--line)}
.rt-row{cursor:pointer}
.rt-row:hover{background:var(--surface)}
.rt-row.is-sel{background:var(--surface-3)}
.rt-sort{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:inherit;font-weight:inherit;padding:0}
.rt-sort svg{transition:transform .15s}
.rt-sort.is-desc svg{transform:rotate(180deg)}
.rt-who{display:flex;align-items:center;gap:12px}
.rt-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.rt-email{text-decoration:underline dotted;text-underline-offset:3px}
.rt-act{display:inline-flex;align-items:center;gap:8px}
.rt-act i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.rt-act--waiting i{background:var(--warn)}
.rt-actions{display:flex;gap:6px;align-items:center}
.rt-btn{height:32px;min-width:137px;border:0;border-radius:8px;background:var(--sc-bg);color:var(--sc-ink);font-weight:500;font-size:13.5px;padding:0 14px}
.rt-btn:hover:not(:disabled){background:var(--sc-hover)}
.rt-btn:disabled{opacity:.6;cursor:not-allowed}
.rt-btn--join{background:var(--warn);color:var(--warn-btn-ink)}
.rt-btn--join:hover:not(:disabled){background:var(--warn);filter:brightness(1.08)}
.rt-icbtn{width:32px;height:32px;border:0;border-radius:8px;background:var(--sc-bg2);color:#fff;display:grid;place-items:center;flex:none}
.rt-icbtn:hover{filter:brightness(1.1)}
.rt-empty{text-align:center;color:var(--muted);padding:34px 14px!important;height:auto!important}
/* customer panel */
.rt-panel{border-left:1px solid var(--line);overflow-y:auto;min-height:0;background:var(--bg)}
.rt-ptabs{display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.rt-ptab{width:36px;height:36px;display:grid;place-items:center;border:0;background:transparent;border-radius:9px;color:var(--ink)}
.rt-ptab.is-on{background:var(--surface-3)}
.rt-ptab:hover{background:var(--surface-2)}
.rt-ptab .ai{width:9px;height:16px;border-radius:5px;background:var(--ai)}
.rt-ptabs .sp{flex:1}
.rt-phead{display:flex;gap:12px;align-items:center;padding:16px 18px 10px}
.rt-phead .tx{flex:1;min-width:0}
.rt-phead b{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.rt-phead small{color:var(--muted);font-size:12.5px}
.rt-chev{border:0;background:transparent;color:var(--ink);width:30px;height:30px;display:grid;place-items:center;border-radius:8px}
.rt-chev:hover{background:var(--surface-2)}
.rt-chev svg{transition:transform .15s}
.rt-chev.is-closed svg{transform:rotate(-90deg)}
.rt-panel .wk-schips{border-bottom:0;padding-bottom:12px}
.rt-tellrow{padding:0 18px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.rt-tell{align-self:flex-start;border:1px solid var(--line-2);background:transparent;border-radius:9px;padding:9px 14px;font-weight:600;font-size:13px}
.rt-tell:hover{background:var(--surface-2)}
.rt-q{margin:0;font-size:12.5px}
.rt-chips{display:flex;flex-wrap:wrap;gap:8px}
.rt-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:transparent;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:500}
.rt-chip:hover{background:var(--surface-2)}
.rt-linkbtn{border:0;background:none;padding:0;color:var(--accent-ink);text-align:left;font-size:12.5px}
.rt-linkbtn:hover{text-decoration:underline}
.rt-field{display:flex;flex-direction:column;gap:4px}
.rt-field label{color:var(--muted);font-size:12px}
.rt-pill{font-weight:500;font-size:11.5px;background:var(--surface-3);padding:2px 9px;border-radius:7px}
.rt-pg{display:flex;gap:10px;align-items:flex-start}
.rt-pg i{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:6px;flex:none}
.rt-pg b{display:block;font-weight:500;overflow-wrap:anywhere}
.rt-pg small{color:var(--muted)}
.rt-devs{display:flex;gap:6px}
.rt-dev{width:26px;height:26px;border-radius:7px;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:700}
@media (max-width:1120px){.rt{grid-template-columns:minmax(0,1fr)}.rt-panel{display:none}}
@media (max-width:760px){.rt{height:auto}.rt-body{overflow:visible}.rt-panel{display:block;border-left:0;border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.rt-sort svg,.rt-chev svg{transition:none}}

/* ── LiveChatPages.css: Team, Reports, AI agent settings (copied) ───────────────────── */
.lcp{color:var(--ink);font-size:14px;line-height:1.45;width:0;min-width:100%}
.lcp *,.lcp *::before,.lcp *::after{box-sizing:border-box}
.lcp button,.lcp input,.lcp select,.lcp textarea{font:inherit;color:inherit}
.lcp :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lcp-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lcp-title h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.lcp-eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent-ink);text-transform:uppercase}
.lcp-muted{color:var(--muted)}
.lcp-mono{font-family:ui-monospace,"JetBrains Mono",Menlo,monospace;font-size:12.5px;font-variant-numeric:tabular-nums}
.lcp-note{color:var(--muted);font-size:12.5px;margin:10px 2px 0}
.lcp-error{background:var(--err-bg);color:var(--danger-ink);font-weight:600;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:10px}
.lcp-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}
.lcp-btn:hover:not(:disabled){border-color:var(--ink)}
.lcp-btn:disabled{opacity:.55;cursor:not-allowed}
.lcp-btn--primary{background:var(--accent);border-color:var(--accent);color:#fff}
.lcp-btn--danger{color:var(--urgent);border-color:var(--danger-line)}
.lcp-btn--small{padding:4px 10px;font-size:12px}
.lcp-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.lcp-table{border-collapse:collapse;width:100%;min-width:860px}
.lcp-table th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.lcp-table td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.lcp-table tr:last-child td{border-bottom:0}
.lcp-who{display:flex;align-items:center;gap:10px}
.lcp-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;background:var(--surface-2)}
.lcp-av--ai{background:var(--ai-soft);color:var(--ai)}
.lcp-name-edit{display:flex;gap:6px;align-items:center}
.lcp-name-edit input{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 8px;width:150px}
.lcp-range{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lcp-range label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.lcp-range input[type="date"]{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px}
.lcp-chips{display:flex;gap:6px;flex-wrap:wrap}
.lcp-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.lcp-chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.lcp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.lcp-card{background:var(--surface);border-radius:16px;padding:16px 20px;border-top:3px solid var(--accent);box-shadow:0 6px 18px -12px var(--shadow-c2)}
.lcp-card--ai{border-color:var(--ai)}.lcp-card--ok{border-color:var(--ok)}.lcp-card--warn{border-color:var(--warn)}
.lcp-n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.lcp-l{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.lcp-sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.lcp-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.lcp-panel h3{margin:0 0 4px;font-size:15px;font-weight:800}
.lcp-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.lcp-legend{display:flex;gap:16px;font-size:12.5px;font-weight:600;margin:4px 0 8px}
.lcp-legend span{display:inline-flex;align-items:center;gap:6px}
.lcp-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lcp-chart{position:relative}
.lcp-chart svg{width:100%;height:auto;display:block}
.lcp-chart text{fill:var(--muted);font-size:11px}
.lcp-chart .gl{stroke:var(--line);stroke-width:1}
.lcp-chart .gx{stroke:var(--line-2);stroke-width:1}
.lcp-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}
.lcp-tip b{font-weight:700}
.lcp-bars{display:grid;gap:6px;margin-top:8px}
.lcp-bar-row{display:grid;grid-template-columns:38px 1fr 34px;gap:10px;align-items:center;font-size:12.5px}
.lcp-bar-track{height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.lcp-bar-fill{height:100%;background:#d4930a;border-radius:0 4px 4px 0}
.lcp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;align-items:start}
@media (max-width:520px){.lcp-grid{grid-template-columns:1fr}}
.lcp-field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.lcp-field>label{font-size:12.5px;font-weight:700}
.lcp-field input[type="text"],.lcp-field input[type="number"],.lcp-field select,.lcp-field textarea,.lcp-row input[type="text"],.lcp-row input[type="number"],.lcp-row select,.lcp-row textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 9px;width:100%}
.lcp textarea{min-height:84px;resize:vertical}
.lcp-help{font-size:12px;color:var(--muted)}
.lcp-radio,.lcp-check{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:13.5px}
.lcp-radio small{display:block;color:var(--muted);font-size:12px}
.lcp-radio input,.lcp-check input{margin-top:3px}
.lcp-row{display:grid;gap:8px;align-items:center;margin-top:8px}
.lcp-row--price{grid-template-columns:1fr 110px auto}
.lcp-option{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;display:grid;gap:8px}
.lcp-option-top{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center}
.lcp-option-actions{display:flex;gap:4px}
.lcp-field-error{color:var(--urgent);font-size:12px;font-weight:600}
.lcp-savebar{position:sticky;bottom:0;z-index:3;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:6px;box-shadow:0 -8px 20px -16px var(--shadow-c2)}
.lcp-saved{color:var(--ok);font-weight:700}
.lcp-viewonly{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:13px;padding:8px 14px;border-radius:12px;margin-bottom:12px}
.lcp fieldset{border:0;margin:0;padding:0;min-width:0}
.lcp-log td{vertical-align:top}
.lcp-log ul{margin:0;padding-left:16px}
.lcp-log li{margin:2px 0;overflow-wrap:anywhere}
@media (max-width:640px){.lcp-option-top{grid-template-columns:1fr}}

/* ── Admin shell: sidebar + top bar, same dark system ── */
.art-bar{position:sticky;top:0;z-index:300;min-height:44px;margin:0;padding:6px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.ad-root{--art-h:44px;display:flex;min-height:calc(100vh - var(--art-h));width:100%;max-width:100vw;background:var(--bg);color:var(--ink);position:relative;overflow-x:clip}
.ad-sidebar{position:fixed;top:calc(var(--art-h) + 12px);left:12px;bottom:12px;width:244px;z-index:200;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.ad-profile{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:12px 12px 4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.ad-profile-avatar{width:40px;height:40px;background:var(--av-me);color:var(--av-me-ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.ad-profile-info{min-width:0}
.ad-profile-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-profile-role{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.08em}
.ad-nav{padding:12px;flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.ad-nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;text-align:left;width:100%;text-decoration:none;transition:background .15s,color .15s}
.ad-nav-item:hover{background:var(--surface-2);color:var(--ink)}
.ad-nav-item.active{background:var(--surface-3);color:var(--ink);font-weight:600}
.ad-nav-icon{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ad-nav-badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--urgent);color:#fff;padding:1px 7px;border-radius:20px}
.ad-nav-group{display:flex;flex-direction:column;gap:2px}
.ad-nav-arrow{margin-left:auto;font-size:17px;line-height:1;opacity:.7;transition:transform .18s ease}
.ad-nav-parent.open .ad-nav-arrow{transform:rotate(90deg)}
.ad-nav-parent:focus-visible,.ad-flyout .ad-nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ad-new{margin-left:8px;font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--ok);color:#062814;border-radius:6px;padding:2px 6px}
.ad-nav-parent .ad-nav-badge{margin-left:8px}
.ad-flyout{position:fixed;z-index:250;min-width:230px;padding:8px;display:flex;flex-direction:column;gap:2px;background:var(--pop-bg);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 16px 40px var(--shadow-c2);animation:ad-flyout-in .14s ease}
.ad-flyout .ad-nav-item{white-space:nowrap}
@keyframes ad-flyout-in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
