<title>HCC Image Signature</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: same admin look (navy header, light page). Two tabs: "My signature" (upload only) and "Compose" (clean body + signature strip). Single light theme to match the live dashboard. */
:root{
  --page:#eef2f8; --surface:#fff; --soft:#f5f7fb; --line:#e3e8f1; --hover:#f1f5fd;
  --navy:#0b1a4f; --ink:#16213e; --muted:#66718a; --faint:#98a2b6;
  --blue:#2563eb; --blue-soft:#e4ecfd; --green:#0f8a5f; --green-soft:#e3f5ec; --red:#c2352b; --red-soft:#fbe5e3; --amber:#a26300; --amber-soft:#fdf1da;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.note{background:var(--amber-soft);color:var(--amber);font-size:12.5px;text-align:center;padding:6px 16px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
.top{background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-size:18px;font-weight:700}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;align-self:flex-start}
.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 16px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--blue);color:#fff}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h2{margin:0 0 4px;font-size:19px}
.card .sub{color:var(--muted);margin:0 0 18px}
.drop{border:2px dashed #c9d4ea;border-radius:14px;padding:34px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);cursor:pointer;background:var(--soft)}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop b{color:var(--ink);font-size:15px}
.drop .big{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.drop small{font-size:12.5px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}

.preview-h{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.mailframe{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mf-head{background:var(--soft);border-bottom:1px solid var(--line);padding:10px 14px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.mf-head b{color:var(--ink)}
.mf-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.mf-body p{margin:0;color:var(--ink)}
.sigimg{display:block;max-width:100%;width:600px;height:auto;border-radius:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn-p{background:var(--blue);color:#fff}
.btn-g{background:var(--surface);border:1px solid var(--line)}
.btn-g:hover{background:var(--hover)}
.btn-d{background:var(--surface);border:1px solid #f1c6c2;color:var(--red)}
.toggle{display:flex;align-items:center;gap:10px;margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.toggle input{width:18px;height:18px;accent-color:var(--blue)}
.toggle small{display:block;color:var(--muted);font-size:12.5px}
.info{margin-top:14px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.confirm{margin-top:12px;background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}

/* compose */
.compose{background:var(--surface);border-radius:14px;box-shadow:0 10px 40px rgba(11,26,79,.18);overflow:hidden;max-width:720px;width:100%;align-self:center;border:1px solid var(--line)}
.ch{background:var(--navy);color:#fff;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between}
.crow{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);min-height:44px}
.crow label{color:var(--muted);font-size:13px;min-width:44px}
.crow input,.crow select{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 0}
.compose textarea{display:block;width:100%;border:0;outline:0;resize:vertical;min-height:170px;padding:14px 16px}
.sigstrip{margin:0 16px 12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.sigstrip .top2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sigstrip label.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.sigstrip input{width:17px;height:17px;accent-color:var(--blue)}
.sigstrip a{color:var(--blue);font-size:12.5px;font-weight:600;text-decoration:none;margin-left:auto;cursor:pointer}
.sigstrip .thumb{max-width:100%;width:420px;height:auto;border-radius:4px;border:1px solid var(--line)}
.sigstrip.off .thumb{opacity:.3;filter:grayscale(1)}
.sigstrip .none{color:var(--muted);font-size:13px}
.cf{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.cf .by{color:var(--muted);font-size:13px}
.cf .chk2{display:flex;align-items:center;gap:6px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:9}
@media (max-width:560px){.card{padding:16px}.crow label{min-width:36px}}
</style>

<div class="note">Demo — naya simple signature design. Sirf image upload, aur kuch nahi.</div>
<div class="wrap">
  <header class="top"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><h1>Email</h1></header>
  <div class="tabs" role="tablist"><button class="on" data-tab="sig" role="tab">My signature</button><button data-tab="compose" role="tab">Compose (preview)</button></div>

  <section id="sigView" class="card">
    <h2>My email signature</h2>
    <p class="sub">Upload one image. It is added below your message in mails you send. Only you can see and change it.</p>
    <div id="sigBody"></div>
  </section>

  <section id="composeView" hidden>
    <div class="compose">
      <div class="ch"><span>New Message</span><span>⤢ ×</span></div>
      <div class="crow"><label for="from">From</label><select id="from"><option>support — support@humancareconnect.co</option><option>strategicalliance@humancareconnect.co</option></select></div>
      <div class="crow"><label for="to">To</label><input id="to" value="client@example.com"></div>
      <div class="crow"><input id="sub" value="Your appointment on 18 Oct" aria-label="Subject"></div>
      <textarea id="body" aria-label="Message">Dear Mr. Rao,

Your appointment is confirmed for 18 October at 11:00 AM.

Regards</textarea>
      <div class="sigstrip" id="strip"></div>
      <div class="cf"><button class="btn btn-p" id="send">Send</button><span>📎</span><span class="by">Sent by <b>Super Admin</b></span><label class="chk2"><input type="checkbox" checked> Track opens</label></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="file" accept="image/png,image/jpeg" aria-label="Upload signature image">

const $=s=>document.querySelector(s);
const I={up:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',

function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,2400)}

function renderSig(){
 if(!sig){
  $("#sigBody").innerHTML=`<label class="drop" id="drop" for="file" tabindex="0">
    <span class="big">${I.up}</span><b>Upload signature image</b><span>Drag an image here or click to choose</span>
    <small>PNG or JPG · best 600px wide · it will be resized automatically</small></label>`;
  bindDrop();
 }else{
  $("#sigBody").innerHTML=`<p class="preview-h">How it looks in a mail</p>
   <div class="mailframe"><div class="mf-head"><span><b>From:</b> Human Care Connect &lt;support@humancareconnect.co&gt;</span><span><b>To:</b> client@example.com</span></div>
   <div class="mf-body"><p>Dear Mr. Rao,</p><p>Your appointment is confirmed for 18 October at 11:00 AM.</p><p>Regards</p><img class="sigimg" src="${sig}" alt="Signature"></div></div>
   <div class="row"><label class="btn btn-g" for="file">${I.sw}Replace image</label><button class="btn btn-d" data-act="askdel">${I.del}Remove</button></div>
   ${confirmDel?`<div class="confirm">Remove your signature image? <button class="btn btn-d" data-act="del">Remove</button><button class="btn btn-g" data-act="nodel">Cancel</button></div>`:""}
   <label class="toggle"><input type="checkbox" id="auto" ${autoAdd?"checked":""}><span><b>Add to new mails automatically</b><small>You can still switch it off for a single mail while writing.</small></span></label>
   <p class="info">${I.lock}Only you can see this signature. Other admins have their own.</p>`;
 }
}
function renderStrip(){
 const s=$("#strip");
 if(!sig){s.className="sigstrip";s.innerHTML=`<div class="top2"><span class="none">No signature yet.</span><a data-goto="sig">Upload one</a></div>`;return}
 s.className="sigstrip"+(useNow?"":" off");
 s.innerHTML=`<div class="top2"><label class="chk"><input type="checkbox" id="useNow" ${useNow?"checked":""}> Add my signature</label><a data-goto="sig">Change</a></div><img class="thumb" src="${sig}" alt="Signature preview">`;
}
function bindDrop(){
 const d=$("#drop");if(!d)return;
 ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over")}));
 ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over")}));
 d.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)load(f)});
 d.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#file").click()}});
}
function load(f){
 if(!/^image\/(png|jpeg)$/.test(f.type)){toast("Please choose a PNG or JPG image");return}
 const r=new FileReader();r.onload=()=>{sig=r.result;useNow=autoAdd;confirmDel=false;renderSig();renderStrip();toast("Signature saved")};r.readAsDataURL(f);
}
$("#file").addEventListener("change",e=>{const f=e.target.files[0];if(f)load(f);e.target.value=""});
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-tab]");if(t){show(t.dataset.tab);return}
 const g=e.target.closest("[data-goto]");if(g){show(g.dataset.goto);return}
 const a=e.target.closest("[data-act]");if(!a)return;
 if(a.dataset.act==="askdel"){confirmDel=true;renderSig()}
 if(a.dataset.act==="nodel"){confirmDel=false;renderSig()}
 if(a.dataset.act==="del"){sig=null;confirmDel=false;renderSig();renderStrip();toast("Signature removed")}
});
document.addEventListener("change",e=>{
 if(e.target.id==="auto"){autoAdd=e.target.checked;toast(autoAdd?"Will be added to new mails":"Won't be added automatically")}
 if(e.target.id==="useNow"){useNow=e.target.checked;renderStrip()}
});
$("#send").addEventListener("click",()=>toast(sig&&useNow?"Sent with your signature image":"Sent without signature"));
function show(tab){
 document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
 $("#sigView").hidden=tab!=="sig";$("#composeView").hidden=tab!=="compose";
 if(tab==="compose"){useNow=!!sig&&autoAdd;renderStrip()}
}
renderSig();renderStrip();
</script>
